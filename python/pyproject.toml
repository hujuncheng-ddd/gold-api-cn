[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-api"
version = "1.0.0"
description = "GoldAPI (gold-api.cn) 贵金属行情 Python SDK —— 黄金/白银/铂金/钯金等 70+ 品种实时行情，一次请求批量 50 个品种"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "GoldAPI", email = "721449117@qq.com" }
]
keywords = [
    "gold", "silver", "platinum", "palladium",
    "gold-price", "precious-metals", "quotes", "api", "sdk",
    "贵金属", "黄金", "行情", "金价"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://www.gold-api.cn"
Documentation = "https://www.gold-api.cn/docs.php"
Repository = "https://github.com/hujuncheng-ddd/gold-api-cn"
Changelog = "https://github.com/hujuncheng-ddd/gold-api-cn/releases"

[tool.setuptools]
packages = ["gold_api"]
